<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>مساعد البحث عن بلاغ</title>
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <h1>🔍 مساعد البحث عن بلاغ</h1>
    </header>

    <!-- Status Card -->
    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon">⏳</div>
      <div class="status-info">
        <span class="status-text" id="statusText">جاهز</span>
        <span class="status-detail" id="statusDetail">جاري التحقق...</span>
      </div>
    </div>

    <!-- Note -->
    <p class="note">💡 لوحة التحكم مدمجة في الصفحة</p>

    <!-- Actions -->
    <div class="actions">
      <button id="openPage" class="btn btn-primary">فتح صفحة البورتال</button>
      <button id="resetBtn" class="btn btn-danger" style="display: none;">🔄 إعادة تعيين</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
